<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Traceur GPS Pro v2.7.1</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #2c3e50; font-family: sans-serif; }
        .app-container { display: flex; flex-direction: column; height: 100vh; }
        .controls { padding: 10px; background: #2c3e50; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; z-index: 1000; }
        button { padding: 15px 5px; border: none; border-radius: 10px; font-weight: bold; color: white; text-transform: uppercase; font-size: 0.8em; cursor: pointer; }
        .btn-start { background: #27ae60; }
        .btn-stop { background: #e74c3c; }
        .btn-export { background: #3498db; }
        button:active { opacity: 0.7; }
        #status { font-size: 0.85em; text-align: center; background: #1a252f; padding: 8px; color: #ecf0f1; }
        #map { flex: 1; width: 100%; }
        .version-badge { opacity: 0.5; font-size: 0.8em; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="controls">
            <button class="btn-start" onclick="startTracking()">Départ</button>
            <button class="btn-stop" onclick="stopTracking()">Arrêt</button>
            <button class="btn-export" onclick="exportGPX()">Export</button>
        </div>
        <div id="status">Statut : Prêt <span class="version-badge">v2.7.1</span></div>
        <div id="map"></div>
    </div>

    <script src="capacitor.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let positions = []; 
        let watchId = null;
        let map, polyline, userMarker;

        // Initialisation de la carte
        map = L.map('map', { zoomControl: false }).setView([46.6, 1.8], 5);
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        polyline = L.polyline([], {color: '#e74c3c', weight: 6}).addTo(map);
        userMarker = L.circleMarker([0, 0], {radius: 8, fillColor: "#3498db", color: "#ffffff", weight: 3, fillOpacity: 1});

        async function toggleWakeLock(on) {
            try {
                if (window.Capacitor && Capacitor.Plugins.KeepAwake) {
                    if (on) await Capacitor.Plugins.KeepAwake.keepAwake();
                    else await Capacitor.Plugins.KeepAwake.allowSleep();
                }
            } catch (e) { console.warn("WakeLock non disponible"); }
        }

        async function startTracking() {
            if (watchId) return;
            try {
                if (window.Capacitor && Capacitor.Plugins.Geolocation) {
                    const p = await Capacitor.Plugins.Geolocation.requestPermissions();
                    if (p.location !== 'granted') return alert("Permission GPS refusée");
                }
                await toggleWakeLock(true);
                document.getElementById('status').innerHTML = "📍 Recherche GPS... <span class='version-badge'>v2.7.1</span>";
                
                const options = { enableHighAccuracy: true, timeout: 10000 };
                const callback = (pos, err) => {
                    if (pos) {
                        const { latitude, longitude } = pos.coords;
                        const coords = [latitude, longitude];
                        positions.push({ lat: latitude, lng: longitude, timestamp: new Date().toISOString() });
                        polyline.addLatLng(coords);
                        userMarker.setLatLng(coords).addTo(map);
                        map.setView(coords, 16);
                        document.getElementById('status').innerHTML = `🏃 ${positions.length} pts <span class='version-badge'>v2.7.1</span>`;
                    }
                };

                if (window.Capacitor && Capacitor.Plugins.Geolocation) {
                    watchId = await Capacitor.Plugins.Geolocation.watchPosition(options, callback);
                } else {
                    watchId = navigator.geolocation.watchPosition((p)=>callback(p), (e)=>alert("Erreur GPS"), options);
                }
            } catch (err) { alert("Erreur: " + err.message); }
        }

        async function stopTracking() {
            if (watchId) {
                if (window.Capacitor && Capacitor.Plugins.Geolocation) {
                    await Capacitor.Plugins.Geolocation.clearWatch({ id: watchId });
                } else {
                    navigator.geolocation.clearWatch(watchId);
                }
                watchId = null;
                await toggleWakeLock(false);
                document.getElementById('status').innerHTML = "🛑 Stoppé <span class='version-badge'>v2.7.1</span>";
            }
        }

        async function exportGPX() {
            if (positions.length === 0) return alert("Aucune donnée à exporter");
            let gpx = `<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="TraceurPro"><trk><trkseg>`;
            positions.forEach(p => gpx += `<trkpt lat="${p.lat}" lon="${p.lng}"><time>${p.timestamp}</time></trkpt>`);
            gpx += `</trkseg></trk></gpx>`;

            if (window.Capacitor && Capacitor.Plugins.Share) {
                await Capacitor.Plugins.Share.share({ title: 'Mon Trajet', text: gpx, dialogTitle: 'Partager le fichier GPX' });
            } else {
                const blob = new Blob([gpx], { type: 'application/gpx+xml' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = 'trajet.gpx'; a.click();
            }
        }
    </script>
</body>
</html>
