<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traceur GPS Pro v2.0</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; background: #ecf0f1; }
        #map { flex-grow: 1; width: 100%; border-top: 2px solid #2c3e50; }
        .controls { padding: 15px; background: #2c3e50; color: white; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: opacity 0.2s; }
        button:active { opacity: 0.7; }
        .btn-start { background: #27ae60; color: white; }
        .btn-stop { background: #e74c3c; color: white; }
        .btn-export { background: #3498db; color: white; }
        #status { font-size: 0.9em; text-align: center; background: #1a252f; padding: 8px; color: #ecf0f1; font-weight: bold; }
        .version-badge { font-size: 0.7em; color: #95a5a6; margin-left: 5px; }
    </style>
</head>
<body>

    <div class="controls">
        <button class="btn-start" onclick="startTracking()">DÉMARRER</button>
        <button class="btn-stop" onclick="stopTracking()">ARRÊTER</button>
        <button class="btn-export" onclick="exportGPX()">EXPORTER GPX</button>
    </div>
    <div id="status">Statut : Prêt <span class="version-badge">v2.0</span></div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // --- CONFIGURATION ---
        const CURRENT_LOCAL_VERSION = "2.0"; // Version mise à jour
        let positions = []; 
        let watchId = null;
        let map, polyline;

        // Initialisation de la carte
        map = L.map('map').setView([46.6033, 1.8883], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        polyline = L.polyline([], {color: '#e74c3c', weight: 5, opacity: 0.8}).addTo(map);

        // Démarrer le suivi GPS
        function startTracking() {
            if (watchId) return;
            document.getElementById('status').innerHTML = "Signal GPS en cours... <span class='version-badge'>v2.0</span>";
            
            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    const { latitude, longitude } = pos.coords;
                    const timestamp = new Date().toISOString();
                    const newPos = [latitude, longitude];

                    positions.push({ lat: latitude, lng: longitude, timestamp: timestamp });
                    
                    polyline.addLatLng(newPos);
                    map.setView(newPos, 16);
                    document.getElementById('status').innerHTML = `Enregistrement : ${positions.length} pts <span class='version-badge'>v2.0</span>`;
                },
                (err) => {
                    console.error(err);
                    alert("Erreur GPS : Vérifie que la position est activée.");
                },
                { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
            );
        }

        // Arrêter le suivi
        function stopTracking() {
            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
                document.getElementById('status').innerHTML = "Suivi arrêté <span class='version-badge'>v2.0</span>";
            }
        }

        // --- EXPORT GPX (Compatible Android & Web) ---
        async function exportGPX() {
            if (positions.length === 0) {
                alert("Aucun point enregistré.");
                return;
            }

            let gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="TraceurGPS_Pro" xmlns="http://www.topografix.com/GPX/1/1">
    <trk>
        <name>Trajet v2.0 - ${new Date().toLocaleString()}</name>
        <trkseg>`;
            
            positions.forEach(p => {
                gpx += `
            <trkpt lat="${p.lat}" lon="${p.lng}"><time>${p.timestamp}</time></trkpt>`;
            });

            gpx += `
        </trkseg>
    </trk>
</gpx>`;

            try {
                // Utilisation du plugin Share de Capacitor si disponible
                if (window.Capacitor && Capacitor.isPluginAvailable('Share')) {
                    await Capacitor.Plugins.Share.share({
                        title: 'Mon trajet GPX',
                        text: gpx,
                        fileName: 'trajet_pro.gpx'
                    });
                } else {
                    // Méthode de secours pour navigateur classique
                    const blob = new Blob([gpx], { type: 'application/gpx+xml' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'trajet_v2.gpx';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                }
            } catch (error) {
                alert("Erreur lors du partage.");
            }
        }
    </script>
</body>
</html>
