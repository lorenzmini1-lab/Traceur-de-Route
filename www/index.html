<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Traceur GPS v2.7.8</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #2c3e50; font-family: sans-serif; overflow: hidden; }
        .app-container { display: flex; flex-direction: column; height: 100vh; }
        .header { background: #1a252f; color: #3498db; text-align: center; padding: 8px; font-weight: bold; font-size: 0.9em; }
        .controls { padding: 10px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; background: #2c3e50; }
        button { padding: 15px 5px; border: none; border-radius: 10px; color: white; font-weight: bold; text-transform: uppercase; font-size: 0.8em; }
        .btn-start { background: #27ae60; } .btn-stop { background: #e74c3c; } .btn-export { background: #3498db; }
        #map { flex: 1; width: 100%; }
        #status { background: #1a252f; color: white; text-align: center; padding: 8px; font-size: 0.85em; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">GPS TRACKER v2.7.8</div>
        <div class="controls">
            <button class="btn-start" onclick="startTracking()">Départ</button>
            <button class="btn-stop" onclick="stopTracking()">Arrêt</button>
            <button class="btn-export" onclick="exportGPX()">Export</button>
        </div>
        <div id="status">Prêt (v2.7.8)</div>
        <div id="map"></div>
    </div>

    <script src="capacitor.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let positions = [];
        let watchId = null;
        let map = L.map('map', {zoomControl: false}).setView([46.6, 1.8], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        let polyline = L.polyline([], {color: '#e74c3c', weight: 5}).addTo(map);

        async function startTracking() {
            if (watchId) return;
            try {
                if (window.Capacitor) {
                    await Capacitor.Plugins.Geolocation.requestPermissions();
                }
                document.getElementById('status').innerText = "Enregistrement... (v2.7.8)";
                watchId = await Capacitor.Plugins.Geolocation.watchPosition({enableHighAccuracy: true}, (pos) => {
                    if (pos) {
                        const pt = [pos.coords.latitude, pos.coords.longitude];
                        positions.push({lat: pt[0], lng: pt[1], time: new Date().toISOString()});
                        polyline.addLatLng(pt);
                        map.setView(pt, 16);
                        document.getElementById('status').innerText = `🏃 ${positions.length} points (v2.7.8)`;
                    }
                });
            } catch (e) { alert(e.message); }
        }

        async function stopTracking() {
            if (watchId) {
                await Capacitor.Plugins.Geolocation.clearWatch({id: watchId});
                watchId = null;
                document.getElementById('status').innerText = "Tracé stoppé (v2.7.8)";
            }
        }

        async function exportGPX() {
            if (positions.length < 2) return alert("Pas assez de données.");
            
            let gpx = `<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" xmlns="http://www.topografix.com/GPX/1/1"><trk><trkseg>`;
            positions.forEach(p => gpx += `<trkpt lat="${p.lat}" lon="${p.lng}"><time>${p.time}</time></trkpt>`);
            gpx += `</trkseg></trk></gpx>`;

            if (window.Capacitor && Capacitor.Plugins.Share) {
                // On utilise le plugin Share avec un nom de fichier explicite
                await Capacitor.Plugins.Share.share({
                    title: 'Mon Parcours GPS',
                    text: gpx,
                    // Cette ligne aide Android à proposer "Enregistrer sous"
                    url: 'data:text/xml;base64,' + btoa(gpx),
                    dialogTitle: 'Exporter le fichier .gpx'
                });
            } else {
                console.log(gpx);
            }
        }
    </script>
</body>
</html>
