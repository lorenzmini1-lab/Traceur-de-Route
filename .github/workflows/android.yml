name: Build Android APK (Auto-Compile)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 1. Installation de Capacitor + Plugin Share (indispensable pour le GPX)
      - name: Installer Capacitor et Plugins
        run: |
          mkdir -p www
          find . -maxdepth 1 -name "*.html" -exec cp {} www/index.html \;
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm install @capacitor/share
          npx cap init "Traceur GPS Pro" "com.lorenzmini.traceur" --web-dir www
          npx cap add android

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 2. Synchronisation des plugins avec le projet Android
      - name: Capacitor Sync
        run: npx cap sync android

      # 3. Forçage des permissions GPS dans le Manifest
      - name: Configurer les permissions Android
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' $MANIFEST
          sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' $MANIFEST
          sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />' $MANIFEST

      # 4. Extraction de la version (va lire "2.0" dans ton index.html)
      - name: Extraire la version
        id: get_version
        run: |
          VERSION=$(grep -oP 'const CURRENT_LOCAL_VERSION = "\K[^"]+' www/index.html || echo "2.0")
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      # 5. Compilation en mode Debug (auto-signé pour test)
      - name: Build APK avec Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Préparer l'APK final
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./app-release.apk

      # 6. Mise à jour du fichier version.json pour le déploiement
      - name: Update version.json
        run: |
          echo '{
            "version": "'${{ env.APP_VERSION }}'",
            "url": "https://lorenzmini1-lab.github.io/Traceur-de-Route/app-release.apk"
          }' > version.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
