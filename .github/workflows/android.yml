name: Build Android APK (Version 2.2 - Icon Fix)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer Capacitor et Générateur d'icônes
        run: |
          mkdir -p www
          find . -maxdepth 1 -name "*.html" -exec cp {} www/index.html \;
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/share
          # Outil pour générer les icônes automatiquement
          npm install @capacitor/assets --save-dev
          npx cap init "Traceur GPS Pro" "com.lorenzmini.traceur" --web-dir www
          npx cap add android

      - name: Générer les icônes Android
        run: |
          # Si le fichier icon.png existe, on génère les ressources
          if [ -f "icon.png" ]; then
            npx capacitor-assets generate --android
          fi

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Configurer les permissions Android
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' $MANIFEST
          sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' $MANIFEST
          sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />' $MANIFEST

      - name: Build APK avec Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Préparer l'APK final
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./app-release.apk

      - name: Update version.json
        run: |
          echo '{
            "version": "2.2",
            "url": "https://lorenzmini1-lab.github.io/Traceur-de-Route/app-release.apk"
          }' > version.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
