name: Build Android APK (v2.7.8)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: |
          mkdir -p www
          # On installe uniquement l'essentiel pour éviter les erreurs ERESOLVE
          npm install --force

      - name: Init Capacitor
        run: |
          rm -rf android
          npx cap init "Traceur de Route" "com.traceur.gps" --web-dir www
          npx cap add android

      - name: Config Android (v2.7.8)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          GRADLE="android/app/build.gradle"
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' $MANIFEST
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.WAKE_LOCK" />' $MANIFEST
          # On monte le versionCode à 28
          sed -i 's/versionCode [0-9]*/versionCode 28/' $GRADLE
          sed -i 's/versionName "[^"]*"/versionName "2.7.8"/' $GRADLE

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Finalize & Version JSON
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./app-release.apk
          # On ajoute un ID unique pour forcer la mise à jour du fichier version.json
          echo "{\"version\": \"2.7.8\", \"url\": \"https://lorenzmini1-lab.github.io/Traceur-de-Route/app-release.apk\", \"id\": \"$(date +%s)\"}" > version.json

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          force_orphan: true
