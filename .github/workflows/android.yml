name: Build Android APK (v2.6 - Icônes, GPX et WakeLock)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer les outils
        run: |
          # Ajout de @capacitor/geolocation pour corriger l'autorisation de position
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/share @capacitor/assets @capacitor-community/keep-awake @capacitor/geolocation
          
      - name: Générer les Icônes (Mappemonde)
        run: |
          if [ -f "icon.png" ]; then
            npx capacitor-assets generate --android
          else
            echo "ERREUR : icon.png est introuvable !"
            exit 1
          fi

      - name: Initialiser Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap init "Traceur de Route" "com.traceur.gps" --web-dir www
            npx cap add android
          fi

      - name: Configuration des Permissions Android (GPS)
        run: |
          # On force l'ajout des permissions GPS dans le fichier AndroidManifest
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' $MANIFEST
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' $MANIFEST
          fi

      - name: Mise à jour de la version (v2.6)
        run: |
          # Passage au code 10 pour être sûr qu'Android voit le changement
          sed -i 's/versionCode [0-9]*/versionCode 10/' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "2.6"/' android/app/build.gradle

      - name: Configuration Java & SDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Build APK Final
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Déploiement
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./app-release.apk
          echo '{"version": "2.6", "url": "https://lorenzmini1-lab.github.io/Traceur-de-Route/app-release.apk"}' > version.json

      - name: Push sur GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
