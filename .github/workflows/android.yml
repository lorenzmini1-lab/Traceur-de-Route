name: Build Android APK (v2.6.2 - Final Fix)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer les outils
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/share @capacitor/assets @capacitor-community/keep-awake @capacitor/geolocation
          
      - name: Initialiser le projet Android
        run: |
          # On s'assure que le dossier www existe (requis par Capacitor)
          mkdir -p www
          # On initialise Capacitor et on ajoute la plateforme Android
          npx cap init "Traceur de Route" "com.traceur.gps" --web-dir www
          npx cap add android

      - name: Correction et Versioning
        run: |
          # On attend 2 secondes pour être sûr que le système de fichiers est prêt
          sleep 2
          GRADLE="android/app/build.gradle"
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ -f "$GRADLE" ]; then
            # Mise à jour versionCode 15
            sed -i 's/versionCode [0-9]*/versionCode 15/' $GRADLE
            sed -i 's/versionName "[^"]*"/versionName "2.6.2"/' $GRADLE
          fi

          if [ -f "$MANIFEST" ]; then
            # Injection forcée des permissions et de l'icône
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' $MANIFEST
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' $MANIFEST
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.WAKE_LOCK" />' $MANIFEST
            sed -i 's/android:icon="@mipmap\/ic_launcher"/android:icon="@mipmap\/icon"/' $MANIFEST
            sed -i 's/android:roundIcon="@mipmap\/ic_launcher_round"/android:roundIcon="@mipmap\/icon"/' $MANIFEST
          fi

      - name: Générer les Icônes
        run: |
          if [ -f "icon.png" ]; then
            npx capacitor-assets generate --android
          fi

      - name: Configuration Java & SDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Build APK Final
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Déploiement
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./app-release.apk
          echo '{"version": "2.6.2", "url": "https://lorenzmini1-lab.github.io/Traceur-de-Route/app-release.apk"}' > version.json

      - name: Push sur GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
