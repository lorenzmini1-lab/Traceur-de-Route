name: Build Android APK (v2.7.1)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installation des dépendances
        run: |
          mkdir -p www
          npm install

      - name: Setup Capacitor Android (Nettoyage Forcé)
        run: |
          rm -rf android
          npx cap init "Traceur de Route" "com.traceur.gps" --web-dir www
          npx cap add android

      - name: Injection Permissions et Version (v2.7.1)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          GRADLE="android/app/build.gradle"
          # Ajout des permissions GPS
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' $MANIFEST
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' $MANIFEST
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.WAKE_LOCK" />' $MANIFEST
          # Forçage du versionCode à 21 et versionName à 2.7.1
          sed -i 's/versionCode [0-9]*/versionCode 21/' $GRADLE
          sed -i 's/versionName "[^"]*"/versionName "2.7.1"/' $GRADLE

      - name: Génération des Icônes
        run: |
          if [ -f "icon.png" ]; then
            npx capacitor-assets generate --android
          else
            echo "ERREUR : icon.png non trouvé à la racine"
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build de l'APK Final
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Préparation Déploiement
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./app-release.apk
          echo '{"version": "2.7.1", "url": "https://lorenzmini1-lab.github.io/Traceur-de-Route/app-release.apk"}' > version.json

      - name: Push sur GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
