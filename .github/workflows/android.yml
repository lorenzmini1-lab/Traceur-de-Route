name: Build Android APK (v2.7.6 - Force JSON)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: |
          mkdir -p www
          npm install --force
          npm install @capacitor/assets --save-dev --force

      - name: Initialisation
        run: |
          rm -rf android
          npx cap init "Traceur de Route" "com.traceur.gps" --web-dir www
          npx cap add android

      - name: Icon Generation (v2.7.6)
        run: |
          if [ -f "icon.png" ]; then
            rm -rf android/app/src/main/res/mipmap-*
            npx capacitor-assets generate --android
          fi

      - name: Permissions & Versioning (v2.7.6)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          GRADLE="android/app/build.gradle"
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' $MANIFEST
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.WAKE_LOCK" />' $MANIFEST
          # On passe au versionCode 26
          sed -i 's/versionCode [0-9]*/versionCode 26/' $GRADLE
          sed -i 's/versionName "[^"]*"/versionName "2.7.6"/' $GRADLE

      - name: Java & Build
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Finalize & Build
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Create Version JSON (v2.7.6 - Anti-Cache)
        run: |
          # On génère un JSON unique avec l'heure du build pour forcer la mise à jour
          TIMESTAMP=$(date +%s)
          cp android/app/build/outputs/apk/debug/app-debug.apk ./app-release.apk
          echo "{\"version\": \"2.7.6\", \"url\": \"https://lorenzmini1-lab.github.io/Traceur-de-Route/app-release.apk\", \"build\": \"$TIMESTAMP\"}" > version.json

      - name: Push to GH-Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          force_orphan: true
