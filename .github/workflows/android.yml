name: Build & Auto-Update APK

on:
  push:
    branches: [ main ] # Se déclenche quand tu envoies du code sur main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      # Étape 1 : Simulation de la version (on peut l'extraire de ton code ou la définir ici)
      - name: Définir le numéro de version
        run: echo "APP_VERSION=1.1" >> $GITHUB_ENV

      # Étape 2 : Création de l'APK (Si tu utilises un outil spécifique, adapte ici)
      # Ici, on imagine que tu as déjà ton processus de build APK.
      
      # Étape 3 : Mise à jour automatique de version.json
      - name: Update version.json
        run: |
          echo '{
            "version": "'${{ env.APP_VERSION }}'",
            "url": "https://lorenzmini1-lab.github.io/Traceur-de-Route/app-release.apk"
          }' > version.json

      # Étape 4 : Envoi sur GitHub Pages (branche gh-pages ou main)
      - name: Deploy to GitHub Pages
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update version.json to v${{ env.APP_VERSION }}"
          file_pattern: 'version.json'
