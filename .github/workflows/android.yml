name: Build Android APK (v2.6.2 - Correction)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer les outils
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/share @capacitor/assets @capacitor-community/keep-awake @capacitor/geolocation
          
      - name: Initialiser Capacitor
        run: |
          # On crée le dossier SEULEMENT s'il n'existe pas sur ton GitHub
          if [ ! -d "android" ]; then
            npx cap init "Traceur de Route" "com.traceur.gps" --web-dir www
            npx cap add android
          fi

      - name: Mise à jour Version et Manifeste
        run: |
          # Maintenant que le dossier existe, on peut modifier les fichiers
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          GRADLE="android/app/build.gradle"
          
          # 1. Versioning (Code 14)
          sed -i 's/versionCode [0-9]*/versionCode 14/' $GRADLE
          sed -i 's/versionName "[^"]*"/versionName "2.6.2"/' $GRADLE
          
          # 2. Injection des permissions GPS si elles manquent
          if ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST"; then
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' $MANIFEST
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' $MANIFEST
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.WAKE_LOCK" />' $MANIFEST
          fi

      - name: Générer les Icônes
        run: |
          if [ -f "icon.png" ]; then
            npx capacitor-assets generate --android
          fi

      - name: Configuration Java & SDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Build APK Final
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Déploiement
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./app-release.apk
          echo '{"version": "2.6.2", "url": "https://lorenzmini1-lab.github.io/Traceur-de-Route/app-release.apk"}' > version.json

      - name: Push sur GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
