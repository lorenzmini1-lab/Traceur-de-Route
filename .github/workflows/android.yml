name: Build Android APK (v2.7.1 - Manifest Manuel)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer les outils
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/share @capacitor/assets @capacitor-community/keep-awake @capacitor/geolocation
          
      - name: Générer les Icônes (Mappemonde 1024x1024)
        run: |
          if [ -f "icon.png" ]; then
            # Cette commande va créer les fichiers dans android/app/src/main/res/mipmap
            npx capacitor-assets generate --android
          else
            echo "ERREUR : icon.png (1024x1024) introuvable !"
            exit 1
          fi

      - name: Préparer Capacitor
        run: |
          # On ne fait pas "npx cap add android" si le dossier existe déjà
          if [ ! -d "android" ]; then
            npx cap init "Traceur de Route" "com.traceur.gps" --web-dir www
            npx cap add android
          fi

      - name: Mise à jour VersionCode
        run: |
          # Passage au code 14 pour forcer la mise à jour
          sed -i 's/versionCode [0-9]*/versionCode 14/' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "2.7.1"/' android/app/build.gradle

      - name: Configuration Java & SDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Build APK Final
        run: |
          cd android
          # On s'assure que le gradlew est exécutable
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Déploiement
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./app-release.apk
          echo '{"version": "2.7.1", "url": "https://lorenzmini1-lab.github.io/Traceur-de-Route/app-release.apk"}' > version.json

      - name: Push sur GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
