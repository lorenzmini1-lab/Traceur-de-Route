name: Build Android APK (v2.7.2 - Icon Force)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: |
          mkdir -p www
          npm install --force

      - name: Initialisation
        run: |
          rm -rf android
          npx cap init "Traceur de Route" "com.traceur.gps" --web-dir www
          npx cap add android

      - name: Force Icon Generation
        run: |
          # ICI : On ajoute --force pour débloquer l'étape rouge de ta capture
          npm install @capacitor/assets --save-dev --force
          if [ -f "icon.png" ]; then
            npx capacitor-assets generate --android
          else
            echo "ERREUR : icon.png manquant !"
            exit 1
          fi

      - name: Permissions & Version (2.7.2)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          GRADLE="android/app/build.gradle"
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' $MANIFEST
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.WAKE_LOCK" />' $MANIFEST
          sed -i 's/versionCode [0-9]*/versionCode 22/' $GRADLE
          sed -i 's/versionName "[^"]*"/versionName "2.7.2"/' $GRADLE

      - name: Java & Build
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Finalize
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Deploy
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./app-release.apk
          echo '{"version": "2.7.2", "url": "https://lorenzmini1-lab.github.io/Traceur-de-Route/app-release.apk"}' > version.json

      - name: Push
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
