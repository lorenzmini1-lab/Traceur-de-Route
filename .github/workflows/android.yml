name: Build Android APK (Auto-Compile)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      # 1. Installation de l'environnement Node.js (nécessaire pour Capacitor)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 2. Installation de Capacitor et des dépendances
      - name: Installer Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Traceur GPS Pro" "com.lorenzmini.traceur" --web-dir .
          npx cap add android

      # 3. Setup de Java (nécessaire pour compiler l'APK)
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 4. Extraction de la version (pour ton version.json)
      - name: Extraire la version
        id: get_version
        run: |
          VERSION=$(grep -oP 'const CURRENT_LOCAL_VERSION = "\K[^"]+' index.html)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      # 5. Compilation de l'APK (Release)
      - name: Build APK avec Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      # 6. Renommer et déplacer l'APK pour GitHub Pages
      - name: Préparer l'APK pour le déploiement
        run: |
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk ./app-release.apk

      # 7. Mise à jour automatique de version.json
      - name: Update version.json
        run: |
          echo '{
            "version": "'${{ env.APP_VERSION }}'",
            "url": "https://lorenzmini1-lab.github.io/Traceur-de-Route/app-release.apk"
          }' > version.json

      # 8. Commit et Push du JSON et de l'APK sur GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
