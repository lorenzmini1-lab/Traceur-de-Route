name: Build Android APK (Auto-Compile)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      # 1. Setup Node v22 (Requis pour Capacitor)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 2. Installation de Capacitor
      - name: Installer Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          # On initialise sans dossier web spécifique pour l'instant
          npx cap init "Traceur GPS Pro" "com.lorenzmini.traceur" --web-dir . --confirm
          npx cap add android

      # 3. Setup de Java
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 4. Extraction de la version pour le JSON
      - name: Extraire la version
        id: get_version
        run: |
          # On cherche la version dans index.html
          VERSION=$(grep -oP 'const CURRENT_LOCAL_VERSION = "\K[^"]+' index.html || echo "1.0")
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      # 5. Synchronisation et Build Gradle
      - name: Build APK avec Gradle
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      # 6. Préparation de l'APK pour le déploiement
      - name: Préparer l'APK
        run: |
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk ./app-release.apk

      # 7. Création automatique du version.json
      - name: Update version.json
        run: |
          echo '{
            "version": "'${{ env.APP_VERSION }}'",
            "url": "https://lorenzmini1-lab.github.io/Traceur-de-Route/app-release.apk"
          }' > version.json

      # 8. Publication sur GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
