name: Build Android APK (v2.7.0 - Force Update)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer les outils
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/share @capacitor/assets @capacitor-community/keep-awake @capacitor/geolocation
          
      - name: Initialiser le projet Android (Nettoyage Forcé)
        run: |
          mkdir -p www
          # Suppression de l'ancien dossier pour éviter l'erreur "already exists"
          rm -rf android
          npx cap init "Traceur de Route" "com.traceur.gps" --web-dir www
          npx cap add android

      - name: Correction et Versioning (v2.7.0)
        run: |
          GRADLE="android/app/build.gradle"
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ -f "$GRADLE" ]; then
            # On passe au code 17 pour forcer la mise à jour système
            sed -i 's/versionCode [0-9]*/versionCode 17/' $GRADLE
            sed -i 's/versionName "[^"]*"/versionName "2.7.0"/' $GRADLE
          fi

          if [ -f "$MANIFEST" ]; then
            # Ré-injection des permissions indispensables
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' $MANIFEST
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' $MANIFEST
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.WAKE_LOCK" />' $MANIFEST
            # Force l'utilisation de la nouvelle icône mappemonde
            sed -i 's/android:icon="@mipmap\/ic_launcher"/android:icon="@mipmap\/icon"/' $MANIFEST
            sed -i 's/android:roundIcon="@mipmap\/ic_launcher_round"/android:roundIcon="@mipmap\/icon"/' $MANIFEST
          fi

      - name: Générer les Icônes
        run: |
          if [ -f "icon.png" ]; then
            npx capacitor-assets generate --android
          fi

      - name: Configuration Java & SDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Build APK Final
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Déploiement
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./app-release.apk
          echo '{"version": "2.7.0", "url": "https://lorenzmini1-lab.github.io/Traceur-de-Route/app-release.apk"}' > version.json

      - name: Push sur GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
