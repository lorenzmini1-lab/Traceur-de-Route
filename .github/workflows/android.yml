name: Build Android APK (v2.6.1 - Force Icon & GPS)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer les outils
        run: |
          # Installation de tous les modules nécessaires
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/share @capacitor/assets @capacitor-community/keep-awake @capacitor/geolocation
          
      - name: Générer les Icônes (Mappemonde)
        run: |
          if [ -f "icon.png" ]; then
            # Génération forcée des ressources Android à partir de ton image
            npx capacitor-assets generate --android
          else
            echo "ERREUR : icon.png est introuvable à la racine !"
            exit 1
          fi

      - name: Créer le projet Android
        run: |
          npx cap init "Traceur de Route" "com.traceur.gps" --web-dir www
          npx cap add android

      - name: Correction du Manifeste (Icône et GPS)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # 1. Injection des permissions GPS
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' $MANIFEST
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' $MANIFEST
          
          # 2. Force l'utilisation de l'icône générée au lieu du logo Capacitor par défaut
          sed -i 's/android:icon="@mipmap\/ic_launcher"/android:icon="@mipmap\/icon"/' $MANIFEST
          sed -i 's/android:roundIcon="@mipmap\/ic_launcher_round"/android:roundIcon="@mipmap\/icon"/' $MANIFEST

      - name: Mise à jour de la version (v2.6.1)
        run: |
          # versionCode 13 pour forcer la mise à jour visuelle sur ton tel
          sed -i 's/versionCode [0-9]*/versionCode 13/' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "2.6.1"/' android/app/build.gradle

      - name: Configuration Java & SDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Build APK Final
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Déploiement
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./app-release.apk
          echo '{"version": "2.6.1", "url": "https://lorenzmini1-lab.github.io/Traceur-de-Route/app-release.apk"}' > version.json

      - name: Push sur GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
