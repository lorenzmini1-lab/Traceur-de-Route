name: Build Android APK (v2.7.1 - Final)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installation Propre
        run: |
          mkdir -p www
          # On utilise legacy-peer-deps pour ignorer les conflits de version mineurs
          npm install --legacy-peer-deps

      - name: Initialisation Capacitor
        run: |
          # Nettoyage total pour éviter l'erreur "platform already exists"
          rm -rf android
          npx cap init "Traceur de Route" "com.traceur.gps" --web-dir www
          npx cap add android

      - name: Correction Manifeste et Versions
        run: |
          # On attend que Capacitor ait fini d'écrire les fichiers
          sleep 3
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          GRADLE="android/app/build.gradle"
          
          # Injection des permissions GPS et Anti-Veille
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' $MANIFEST
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.WAKE_LOCK" />' $MANIFEST
          
          # Mise à jour versionCode 21 et versionName 2.7.1
          sed -i 's/versionCode [0-9]*/versionCode 21/' $GRADLE
          sed -i 's/versionName "[^"]*"/versionName "2.7.1"/' $GRADLE

      - name: Génération de l'icône Mappemonde
        run: |
          if [ -f "icon.png" ]; then
            npx capacitor-assets generate --android
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Final APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Exportation
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./app-release.apk
          echo '{"version": "2.7.1", "url": "https://lorenzmini1-lab.github.io/Traceur-de-Route/app-release.apk"}' > version.json

      - name: Déploiement GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
